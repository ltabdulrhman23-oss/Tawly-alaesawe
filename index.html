<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ديوان الطاولي الفلوجي - النسخة المستقرة</title>
    <style>
        /* [نفس الستايل السابق بالظبط لضمان جمالية التصميم] */
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght=500;700;900&display=swap');
        :root { --bg-saj: #05060a; --panel-dark: #0b0e15; --iraqi-shadhar: #00d2ff; --iraqi-kahraman: #ffb300; --soundcloud-orange: #ff5500; --soft-green: #2ecc71; }
        body { font-family: 'Tajawal', sans-serif; margin: 0; background-color: var(--bg-saj); color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .splash-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #04060a; display: flex; justify-content: center; align-items: center; z-index: 9999; transition: all 0.5s; }
        .splash-overlay.hidden { opacity: 0; visibility: hidden; }
        .splash-container { text-align: center; width: 85%; }
        .splash-title { font-size: 28px; font-weight: 900; margin-bottom: 20px; color: var(--iraqi-kahraman); }
        .splash-enter-btn { background: var(--iraqi-shadhar); color: #000; font-weight: 900; padding: 15px 40px; border: none; border-radius: 12px; cursor: pointer; }

        .player-zone { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: var(--panel-dark); position: relative; }
        .top-player { transform: rotate(180deg); }
        .center-bar { background: #000; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #222; border-bottom: 1px solid #222; }
        
        .cyber-cube { font-size: 40px; font-weight: 900; width: 70px; height: 70px; line-height: 70px; border-radius: 15px; background: #121622; text-align: center; border: 1px solid #333; }
        .cyber-cube.rolling { animation: rolling 0.2s infinite linear; }
        @keyframes rolling { 0% { transform: scale(1); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }
        
        .action-btn { padding: 10px 30px; border-radius: 10px; border: none; background: #1a253d; color: #fff; font-weight: bold; cursor: pointer; }
        .action-btn:active { background: #00d2ff; color: #000; }
    </style>
</head>
<body>

    <div class="splash-overlay" id="splashScreen">
        <div class="splash-container">
            <h1 class="splash-title">ديوان الطاولي الفلوجي</h1>
            <button class="splash-enter-btn" onclick="document.getElementById('splashScreen').classList.add('hidden')">دخول الديوان</button>
        </div>
    </div>

    <div class="player-zone top-player" id="zone-2">
        <div id="p2-d1" class="cyber-cube">6</div>
        <button class="action-btn" onclick="roll(2)">رمية</button>
    </div>

    <div class="center-bar"><span>🎲</span><span>📻</span><span>⚙️</span></div>

    <div class="player-zone bottom-player active-turn" id="zone-1">
        <div id="p1-d1" class="cyber-cube">6</div>
        <button class="action-btn" onclick="roll(1)">رمية</button>
    </div>

    <script>
        let isRolling = false;
        let activePlayer = 1;

        function roll(pNum) {
            if (isRolling || activePlayer !== pNum) return;
            isRolling = true;
            
            const dice = document.getElementById(`p${pNum}-d1`);
            dice.classList.add('rolling');
            
            // اهتزاز خفيف
            if (navigator.vibrate) navigator.vibrate(50);

            // تأخير متعمد لضمان سلاسة الأنيميشن وعدم تعليق المعالج
            setTimeout(() => {
                dice.classList.remove('rolling');
                dice.innerText = Math.floor(Math.random() * 6) + 1;
                isRolling = false;
                activePlayer = (pNum === 1) ? 2 : 1;
            }, 600);
        }
    </script>
</body>
</html>
